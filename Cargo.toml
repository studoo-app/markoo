[workspace]
resolver = "3"
members = ["crates/markoo-core", "crates/markoo-cli", "crates/markoo-daemon", "crates/markoo-mcp"]
# The app has its own lock file and target folder: it needs system libraries
# (WebKitGTK on Linux) that the rest of Markoo does not.
exclude = ["app/src-tauri"]

[workspace.package]
version = "1.0.0-rc.2"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/studoo-app/markoo"
description = "Smart sync between a knowledge base and a Git repository"

[workspace.dependencies]
markoo-core = { path = "crates/markoo-core" }
markoo-daemon = { path = "crates/markoo-daemon" }
markoo-mcp = { path = "crates/markoo-mcp" }
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
diffy = "0.5.2"
directories = "6.0.0"
getrandom = "0.4.3"
globset = "0.4.21"
proptest = "1.12.0"
pulldown-cmark = { version = "0.13.6", default-features = false }
rmcp = { version = "3.8.0", default-features = false, features = ["macros", "server", "transport-io", "transport-streamable-http-server"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
toml = "1.1.8"
toml_edit = "0.25.17"
unicode-normalization = "0.1.26"
walkdir = "2.5.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

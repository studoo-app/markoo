[workspace]
resolver = "3"
members = ["crates/markoo-core", "crates/markoo-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/studoo-app/markoo"
description = "Smart sync between a knowledge base and a Git repository"

[workspace.dependencies]
markoo-core = { path = "crates/markoo-core" }
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
diffy = "0.5.2"
directories = "6.0.0"
globset = "0.4.21"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
walkdir = "2.5.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

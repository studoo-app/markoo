name: Release

# A tag `v1.2.3` builds everything and prepares a draft release, which stays
# private until someone publishes it. Started by hand, this only builds.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  cli:
    name: command line (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked -p markoo-cli --target ${{ matrix.target }}
      # The app gets this from Tauri; a command downloaded on its own needs it too.
      # Apple cannot staple a ticket to a bare binary, so a Mac checks it online.
      - name: Sign and notarize, if the Apple secrets exist
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::No Apple certificate: the command is not signed nor notarized."
            exit 0
          fi
          binary="target/${{ matrix.target }}/release/markoo"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          codesign --force --options runtime --timestamp --keychain "$keychain" --sign "$APPLE_SIGNING_IDENTITY" "$binary"
          codesign --verify --strict --verbose=2 "$binary"
          ditto -c -k --keepParent "$binary" "$RUNNER_TEMP/markoo.zip"
          status=$(xcrun notarytool submit "$RUNNER_TEMP/markoo.zip" --wait --output-format json \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["status"])')
          echo "Notarization: $status"
          test "$status" = "Accepted"
          security delete-keychain "$keychain"
      - name: Package
        shell: bash
        run: |
          mkdir dist
          folder="target/${{ matrix.target }}/release"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "dist/markoo-${{ matrix.target }}.zip" "./$folder/markoo.exe" LICENSE README.md
          else
            tar -czf "dist/markoo-${{ matrix.target }}.tar.gz" -C "$folder" markoo -C "$GITHUB_WORKSPACE" LICENSE README.md
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  app:
    name: app (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: app-${{ matrix.target }}
          workspaces: |
            .
            app/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build the command shipped with the app
        run: |
          cargo build --release --locked -p markoo-cli --target ${{ matrix.target }}
          mkdir -p app/src-tauri/binaries
          cp "target/${{ matrix.target }}/release/markoo" "app/src-tauri/binaries/markoo-${{ matrix.target }}"
      - run: npm ci
        working-directory: app
      # An empty variable would count as set: they only exist once the secrets do.
      - name: Use the Apple secrets, if any
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::No Apple certificate: the app is not signed nor notarized."
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"
      # The updater checks a signature made with this key: see the updater
      # section of the app configuration.
      - run: npx tauri build --target ${{ matrix.target }} --config src-tauri/tauri.release.json
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Both architectures make an archive with the same name: each one gets
      # its target in the name, so that the release keeps them apart. All the
      # files go in one flat folder, so that the release job finds them as is.
      - name: Gather the files of the release by architecture
        run: |
          bundle="app/src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir dist
          cp "$bundle"/dmg/*.dmg dist/
          cp "$bundle"/macos/*.app.tar.gz "dist/Markoo-${{ matrix.target }}.app.tar.gz"
          cp "$bundle"/macos/*.app.tar.gz.sig "dist/Markoo-${{ matrix.target }}.app.tar.gz.sig"
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  app-linux:
    name: app (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Install the libraries Tauri needs on Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: app-${{ env.TARGET }}
          workspaces: |
            .
            app/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build the command shipped with the app
        run: |
          cargo build --release --locked -p markoo-cli --target "$TARGET"
          mkdir -p app/src-tauri/binaries
          cp "target/$TARGET/release/markoo" "app/src-tauri/binaries/markoo-$TARGET"
      - run: npm ci
        working-directory: app
      # The updater checks a signature made with this key: see the updater
      # section of the app configuration.
      - run: npx tauri build --target "$TARGET" --bundles appimage,deb --config src-tauri/tauri.release.json
        working-directory: app
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # On Linux the updater takes the AppImage itself, with its signature
      # (no archive). It gets its target in the name, as the macOS archives do.
      - name: Gather the files of the release
        run: |
          bundle="app/src-tauri/target/$TARGET/release/bundle"
          mkdir dist
          cp "$bundle"/deb/*.deb dist/
          cp "$bundle"/appimage/*.AppImage "dist/Markoo-$TARGET.AppImage"
          cp "$bundle"/appimage/*.AppImage.sig "dist/Markoo-$TARGET.AppImage.sig"
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ env.TARGET }}
          path: dist/*
          if-no-files-found: error

  release:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cli, app, app-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag is the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: (cd artifacts && sha256sum * > SHA256SUMS)
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" 'index($0, heading) == 1 { found = 1; next } /^## \[/ { found = 0 } found' CHANGELOG.md > notes.md
          test -s notes.md
          python3 - "$version" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" < notes.md > artifacts/latest.json <<'EOF'
          import datetime, json, pathlib, sys
          version, tag, repo = sys.argv[1:4]
          platforms = {}
          for key, name in [
              ("darwin-aarch64", "Markoo-aarch64-apple-darwin.app.tar.gz"),
              ("darwin-x86_64", "Markoo-x86_64-apple-darwin.app.tar.gz"),
              ("linux-x86_64", "Markoo-x86_64-unknown-linux-gnu.AppImage"),
          ]:
              platforms[key] = {
                  "signature": pathlib.Path("artifacts", name + ".sig").read_text().strip(),
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{name}",
              }
          notes = sys.stdin.read().strip()
          document = {
              "version": version,
              "notes": notes,
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          print(json.dumps(document, indent=2, ensure_ascii=False))
          EOF
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" artifacts/* --draft $prerelease --verify-tag --title "Markoo $version" --notes-file notes.md
